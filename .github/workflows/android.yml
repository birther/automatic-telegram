name: 打包 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
      # cordova-android 12 默认会拉 gradle-7.6-all.zip（200MB），这里换成更小的 bin 包
      CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-7.6-bin.zip

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "runner: $(uname -sr)"
          java -version 2>&1 || true
          node -v || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 自带的 Gradle 9（Groovy 4）无法编译 Cordova 12 的 gradle 脚本
      # （报错 unable to resolve class XmlParser），所以要装回配套的 Gradle 7.6
      - name: 安装 Gradle 7.6
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o gradle76.zip https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q -o gradle76.zip
          rm -f gradle76.zip
          echo "$RUNNER_TEMP/gradle-7.6/bin" >> "$GITHUB_PATH"

      - name: 确认工具版本
        run: |
          gradle -v
          java -version
          node -v

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 补齐 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

      - name: 添加 Android 平台
        run: npx cordova platform add android@12

      - name: 生成 Gradle Wrapper
        run: |
          cd platforms/android
          gradle wrapper --gradle-version 7.6 --distribution-type bin
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 打包 debug APK
        run: |
          set -o pipefail
          npx cordova build android --debug --verbose 2>&1 | tee build-output.log

      - name: 列出产物
        if: always()
        run: ls -lh platforms/android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: food-wheel-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7
